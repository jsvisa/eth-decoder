name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (lint, unit, e2e)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 30
    permissions:
      contents: write # needed to push the auto-generated README coverage table
    steps:
      - uses: actions/checkout@v4
        with:
          # On PRs, check out the branch itself so the bot can push to it.
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('app/**', 'next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check "app/**/*.{js,json}" "tests/**/*.js" "**/*.md" "*.json"

      - name: Lint
        run: npm run lint

      - name: Run unit and API integration tests with coverage
        run: npm run test:coverage

      - name: Regenerate README coverage table
        id: coverage-readme
        run: |
          node scripts/update-coverage-readme.js
          npx prettier --write README.md >/dev/null
          if git diff --quiet README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated README coverage table
        # Forked PRs get read-only tokens, so auto-commit only applies to
        # same-repo branches.
        if: >-
          steps.coverage-readme.outputs.changed == 'true' &&
          (github.event_name == 'push' || !github.event.pull_request.head.repo.fork)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: regenerate README test-coverage table [skip ci]"
          git push

      - name: Run integration tests
        env:
          INTEGRATION_ETHERSCAN_API_KEY: ${{ secrets.INTEGRATION_ETHERSCAN_API_KEY }}
          INTEGRATION_RPC_URL: ${{ secrets.INTEGRATION_RPC_URL }}
        run: npx vitest run --project integration

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

      - name: Run E2E (setup + tests)
        run: ./scripts/run-e2e.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
